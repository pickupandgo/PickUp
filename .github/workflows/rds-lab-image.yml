name: RDS Lab Backend Image - No Deployment

on:
  push:
    branches:
      - mr-aws-rds-lab-20261121

permissions:
  contents: read

concurrency:
  group: rds-lab-image-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/mr-aws-rds-lab-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      NODE_IMAGE: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
      IMAGE: ghcr.io/pickupandgo/mr-backend-rds-lab
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 ref
        with:
          persist-credentials: false

      - name: Prepare ephemeral Docker configuration
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/rds-lab-docker"
          printf 'DOCKER_CONFIG=%s/rds-lab-docker\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Test cleanup and safety configuration without network or a database
        run: |
          set -euo pipefail
          docker build --target deps --build-arg NODE_IMAGE="$NODE_IMAGE" -t mr-lab-test-deps .
          docker run --rm --network none --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            mr-lab-test-deps sh -ec '
              cp /source/tsconfig.json /source/prisma.config.ts /app/
              cp -R /source/src /source/prisma /source/test /app/
              npm run prisma:generate
              npm test -- --runInBand --runTestsByPath src/chat/chat-cleanup.service.spec.ts src/config/app-config.spec.ts src/auth/auth.guard.spec.ts src/prisma/prisma.service.spec.ts
            '

      - name: Build backend runtime image
        run: |
          set -euo pipefail
          docker build --target runtime --build-arg NODE_IMAGE="$NODE_IMAGE" \
            --label org.opencontainers.image.source=https://github.com/pickupandgo/PickUp \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" .
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE:$GITHUB_SHA")" = node
          docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE:$GITHUB_SHA" | grep -Fx '["node","dist/main.js"]'

      - name: Authenticate with GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish isolated test image
        run: |
          set -euo pipefail
          docker push "$IMAGE:$GITHUB_SHA"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"
          {
            echo '### RDS lab image only — no deployment'
            echo "Commit: $GITHUB_SHA"
            echo "Image: $IMAGE:$GITHUB_SHA"
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
