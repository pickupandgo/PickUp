# Local development database only. Production uses a managed PostgreSQL instance.
name: multipleride-backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: multipleride-postgres
    environment:
      POSTGRES_USER: multipleride
      POSTGRES_PASSWORD: multipleride_dev_password
      POSTGRES_DB: multipleride
    ports:
      # Bound to localhost so the database is not reachable from the network.
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U multipleride -d multipleride']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
