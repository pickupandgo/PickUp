<body class="bg-background font-body-md text-on-background antialiased relative min-h-screen flex flex-col items-center justify-center">
<!-- Mock Background (Settings Screen - Dimmed) -->
<div class="absolute inset-0 z-0 bg-surface flex flex-col filter blur-[2px]">
<!-- Top App Bar -->
<header class="w-full sticky top-0 bg-surface text-primary font-headline-md text-headline-md flex items-center justify-between px-container-padding h-row-height-md">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md text-on-surface">Settings</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Dummy Settings Content -->
<main class="flex-1 p-container-padding space-y-4">
<div class="h-20 bg-surface-container-low rounded-lg w-full"></div>
<div class="h-12 bg-surface-container-low rounded-md w-full"></div>
<div class="h-12 bg-surface-container-low rounded-md w-full"></div>
<div class="h-12 bg-surface-container-low rounded-md w-full"></div>
<div class="h-12 bg-surface-container-low rounded-md w-full"></div>
</main>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-lg bg-surface-container-lowest border-t border-outline-variant shadow-sm flex justify-around items-center h-row-height-md px-4">
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high scale-95 active:transition-transform rounded-full px-4 py-1">
<span class="material-symbols-outlined font-headline-sm text-headline-sm text-primary" data-icon="grid_view" data-weight="fill">grid_view</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high scale-95 active:transition-transform rounded-full px-4 py-1">
<span class="material-symbols-outlined font-headline-sm text-headline-sm text-primary" data-icon="local_shipping" data-weight="fill">local_shipping</span>
<span class="font-label-sm text-label-sm">Shipments</span>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 hover:bg-surface-container-high scale-95 active:transition-transform">
<span class="material-symbols-outlined font-headline-sm text-headline-sm text-primary" data-icon="settings" data-weight="fill">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high scale-95 active:transition-transform rounded-full px-4 py-1">
<span class="material-symbols-outlined font-headline-sm text-headline-sm text-primary" data-icon="contact_support" data-weight="fill">contact_support</span>
<span class="font-label-sm text-label-sm">Support</span>
</div>
</nav>
</div>
<!-- Overlay Dimmer -->
<div class="absolute inset-0 bg-primary/40 z-40 transition-opacity duration-300"></div>
<!-- Modal / Bottom Sheet -->
<!-- Positioning for bottom sheet on mobile, centered modal on md+ -->
<div class="absolute bottom-0 w-full md:w-[400px] md:bottom-auto md:top-1/2 md:-translate-y-1/2 z-50 bg-surface-container-lowest rounded-t-[24px] md:rounded-[24px] shadow-lg flex flex-col p-container-padding pb-8 md:pb-container-padding transform transition-transform duration-300 translate-y-0">
<!-- Drag Handle (Mobile Only) -->
<div class="w-full flex justify-center mb-6 md:hidden">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="flex flex-col items-center text-center space-y-4 mb-8">
<div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">logout</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Log out of Pick Up?</h2>
<p class="font-body-md text-body-md text-on-surface-variant px-4">
                You will need to sign in again to book a trip or view your history.
            </p>
</div>
<div class="flex flex-col space-y-3 w-full">
<button class="w-full bg-error text-on-error font-label-sm text-label-sm h-row-height-sm rounded-full flex items-center justify-center hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2">
                Log Out
            </button>
<button class="w-full bg-transparent text-primary border border-outline font-label-sm text-label-sm h-row-height-sm rounded-full flex items-center justify-center hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                Cancel
            </button>
</div>
</div>
