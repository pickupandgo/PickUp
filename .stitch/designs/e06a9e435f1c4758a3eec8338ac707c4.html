<main class="flex-1 mt-row-height-md mb-row-height-md flex flex-col relative">

</div>

<p class="font-body-md text-body-md text-on-surface-variant mb-8 max-w-[280px]">We couldn't load the map data. Please check your connection and try again.</p>
<button class="bg-primary text-on-primary rounded-full px-8 py-3 font-label-sm text-label-sm hover:opacity-90 active:scale-95 transition-all">

            </button>
</div>

<div class="bg-surface-container-lowest rounded-lg p-4 shadow-sm border border-surface-container-highest">

</div>

</button>
</div>
</div>
</div>
