<style>.map-bg {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCRyJWOKsY-us35wkUfj1u9xmtW8WeADcfnDr2SKfp7SirU_iZsNuLuIf7q9jz_HvPFlH8xBFF02XgRKuiB80nWx7jubAdsIXvyD_7h7NUjqjd-zTmqmCKhRkiZQ794igAbEFlpWPw69EYJy5suK7Fr5NMlsnkOdPybfxA8RHjfNQ1dR2-UqsYR10jyG-DHoZbgUevphbrwvC7w61w6Eko782nPjrl1CdVwaetvJMzCX3RrIdz7fwap);
    background-size: cover;
    background-position: center
    }
@keyframes pulse-ring {
    0% {
        transform: scale(0.8);
        opacity: 0.5;
        } 100% {
        transform: scale(2);
        opacity: 0;
        }
    }
@keyframes slide-down {
    0% {
        transform: translateY(-100%);
        opacity: 0;
        } 100% {
        transform: translateY(0);
        opacity: 1;
        }
    }
@keyframes slide-up {
    0% {
        transform: translateY(100%);
        opacity: 0;
        } 100% {
        transform: translateY(0);
        opacity: 1;
        }
    }
@keyframes spinner {
    to {
        transform: rotate(360deg);
        }
    }
.animate-slide-down {
    animation: slide-down 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards
    }
.animate-slide-up {
    animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards
    }
.pulse-marker::before {
    content: "";
    position: absolute;
    left: -50%;
    top: -50%;
    width: 200%;
    height: 200%;
    background-color: theme("colors.primary");
    border-radius: 50%;
    z-index: -1;
    animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite
    }
.loading-spinner {
    border: 2px solid theme("colors.surface-variant");
    border-top-color: theme("colors.primary");
    border-radius: 50%;
    width: 24px;
    height: 24px;
    animation: spinner 0.8s linear infinite
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background h-screen w-full overflow-hidden font-body-md relative antialiased flex flex-col md:hidden">
<!-- Map Canvas -->
<div class="absolute inset-0 z-0 map-bg" data-alt="A clean, modern, minimalist city street map interface showing roads and subtle terrain in light mode aesthetics. Soft greys, whites, and pale blues define the urban grid. The style is highly professional, calm-tech, and optimized for an elegant mobile application experience with high contrast legibility." data-location="San Francisco" style=""></div>
<!-- Top Floating Toast (Driver Found) -->
<div class="absolute top-0 left-0 w-full z-40 pt-12 px-container-padding flex justify-center pointer-events-none animate-slide-down">
<div class="bg-surface-container-lowest/95 backdrop-blur-md shadow-sm border border-surface-variant rounded-full px-6 py-3 flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Driver Found!</span>
</div>
</div>
<!-- Central Map Marker -->
<div class="absolute inset-0 z-10 flex items-center justify-center pointer-events-none mb-24">
<div class="relative pulse-marker flex items-center justify-center">
<div class="bg-primary text-on-primary w-12 h-12 rounded-full flex items-center justify-center shadow-lg relative z-10">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_taxi</span>
</div>
</div>
</div>
<!-- Spacer for flex layout to push bottom sheet down -->
<div class="flex-grow z-20 pointer-events-none"></div>
<!-- Bottom Sheet Expansion -->
<div class="w-full z-30 px-container-padding pb-8 pt-4 animate-slide-up">
<div class="bg-surface-container-lowest/95 backdrop-blur-xl rounded-xl shadow-lg border border-surface-variant p-6 flex flex-col gap-6">
<!-- Handle -->
<div class="w-12 h-1.5 bg-outline-variant rounded-full mx-auto -mt-2 mb-2"></div>
<div class="flex items-center gap-4">
<div class="loading-spinner flex-shrink-0"></div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">Assigning driver to your trip...</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">Matching you with the best vehicle nearby.</span>
</div>
</div>
<!-- Fake Progress Bar -->
<div class="w-full bg-surface-variant h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full rounded-full w-1/3 animate-pulse"></div>
</div>
<!-- Cancel Button -->
<button class="w-full py-4 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm font-semibold hover:bg-surface-container-highest transition-colors mt-2">
                Cancel Request
            </button>
</div>
</div>
