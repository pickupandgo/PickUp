</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Logistics Pro</h1>
<button aria-label="More options" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors active:scale-95 text-on-surface-variant dark:text-on-surface-variant">

</button>

<!-- Decorative Ambient Background -->

<div class="w-[300px] h-[300px] rounded-full bg-surface-container-high blur-[80px] pulse-soft"></div>
</div>
<div class="relative z-10 flex flex-col items-center text-center max-w-sm w-full bg-surface-container-low rounded-lg p-10 shadow-sm border border-surface-container-highest/50">

<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 0, 'wght' 300;">cloud_off</span>
</div>
<!-- Typography Content -->
<h2 class="font-headline-md text-headline-md text-primary mb-3">No Internet Connection</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-10 max-w-[260px] mx-auto leading-relaxed">

            </p>
