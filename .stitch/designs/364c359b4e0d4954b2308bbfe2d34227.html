                    "fontFamily": {

            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Map Background Pattern */
        .bg-map-pattern {
            background-color: #f3f0f2;
            background-image: radial-gradient(#dcd9db 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }
        .animate-pulse-ring::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: inherit;
            border-radius: 50%;
            z-index: -1;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased overflow-hidden h-screen flex flex-col relative">
<!-- Network Offline Banner (Simulated State) -->
<div class="hidden absolute top-row-height-md left-0 w-full z-40 bg-error-container text-on-error-container px-container-padding py-2 text-center font-label-sm flex items-center justify-center gap-2" id="networkBanner">
<span class="material-symbols-outlined text-[16px]">wifi_off</span>
        Reconnecting... trying to find your driver
    </div>
<!-- TopAppBar (from JSON but adapted for Live Tracking) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex items-center justify-between px-container-padding h-row-height-md">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Live Tracking</h1>
</div>
<div class="flex items-center gap-2 bg-surface-container-low px-3 py-1.5 rounded-full">
<div class="w-2 h-2 rounded-full bg-error animate-pulse"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">LIVE</span>
</div>
</header>
<!-- Main Content Area (Map First) -->
<main class="flex-1 relative mt-row-height-md bg-map-pattern">
<!-- Simulated Map Elements -->
<!-- Route Line -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" style="z-index: 1;">
<path class="opacity-30" d="M 100 150 Q 150 300 200 450 T 350 600" fill="none" stroke="#151a31" stroke-dasharray="8 8" stroke-linecap="round" stroke-width="4"></path>
<path d="M 100 150 Q 150 200 180 350" fill="none" stroke="#151a31" stroke-linecap="round" stroke-width="4"></path>
</svg>
<!-- Pickup Marker -->
<div class="absolute top-[130px] left-[80px] z-10 flex flex-col items-center">
<div class="w-8 h-8 bg-surface rounded-full flex items-center justify-center shadow-sm border-2 border-primary-container">
<div class="w-3 h-3 bg-primary-container rounded-full"></div>
</div>
<span class="mt-1 font-label-sm text-label-sm text-on-surface-variant bg-surface/80 px-2 py-0.5 rounded-full backdrop-blur-sm">Pickup</span>
</div>
<!-- Driver Marker (Pulsing) -->
<div class="absolute top-[330px] left-[160px] z-20 flex flex-col items-center">
<div class="relative w-12 h-12 bg-primary-container rounded-full flex items-center justify-center shadow-md animate-pulse-ring text-on-primary">
<span class="material-symbols-outlined">local_shipping</span>
</div>
<div class="mt-2 bg-surface shadow-sm rounded-full px-3 py-1 flex items-center gap-2 border border-surface-container-highest">
<span class="font-label-sm text-label-sm text-on-surface">10s ago</span>
</div>
</div>
<!-- Drop 1 Marker -->
<div class="absolute top-[430px] left-[180px] z-10 flex flex-col items-center">
<div class="w-8 h-8 bg-surface rounded-full flex items-center justify-center shadow-sm border-2 border-outline-variant text-on-surface-variant font-label-caps text-label-caps">
                1
            </div>
</div>
<!-- Drop 2 Marker -->
<div class="absolute top-[580px] left-[330px] z-10 flex flex-col items-center">
<div class="w-8 h-8 bg-surface rounded-full flex items-center justify-center shadow-sm border-2 border-outline-variant text-on-surface-variant font-label-caps text-label-caps">
                2
            </div>
</div>
<!-- Bottom Overlay Container -->
<div class="absolute bottom-0 left-0 w-full z-30 pb-6 px-4 flex flex-col gap-4">
<!-- Trip Status Card (Soft Floating) -->
<div class="bg-surface rounded-[24px] p-5 shadow-[0_8px_32px_rgba(0,0,0,0.08)] border border-surface-container-highest flex flex-col gap-4">
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Drop 1 of 3</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Arriving at Ratanada Hub in <span class="font-semibold text-primary">8 mins</span></p>
</div>
<div class="bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                        On time
                    </div>
</div>
<!-- Progress Bar -->
<div class="w-full bg-surface-container-high h-2 rounded-full overflow-hidden flex">
<div class="bg-primary-container h-full w-1/3 rounded-full"></div>
</div>
<div class="border-t border-surface-container-highest pt-4 mt-2">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-12 h-12 bg-surface-container-high rounded-full overflow-hidden flex items-center justify-center relative">
<img class="w-full h-full object-cover" data-alt="A professional headshot of an Indian delivery driver wearing a collared shirt, well-lit, soft shadows, set against a neutral grey background. The mood is approachable and trustworthy. Minimalist modern corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYxDfKWkql2FzNNKIvWwllsFCfV1EJB7hgJVlqQnN2zZddz3ghiCKWVDPh6vT148pwJsJ0-t5hQSMLgWIHA3fI_whpumXXal41ET6rm3ikc97ewMjgK5AZOILyLBCP0RwitS2uFtAJopxWPD_mEAW3OhDHhUjFnO4YAMnjz8EFhTi-xIzHpBZ7mrAqYjbRfs4o0ee3MtFxJYBk6QexvPED286SMZgBwsNy4MFskQGuwA6B2Nj5kG4W"/>
</div>
<div>
<h3 class="font-data-mono text-data-mono text-on-surface">Ramesh Kumar</h3>
<div class="flex items-center gap-1 text-on-surface-variant font-label-sm text-label-sm mt-0.5">
<span class="material-symbols-outlined filled text-[14px] text-tertiary-fixed-variant">star</span>
                                     4.8
                                     <span class="mx-1">•</span>
                                     Tata Ace
                                 </div>
</div>
</div>
<div class="font-label-caps text-label-caps text-on-surface bg-surface-container-low px-2 py-1 rounded-md border border-surface-container-highest">
                             RJ 19 XX 1234
                         </div>
</div>
<!-- Actions -->
<div class="flex gap-3 mt-4">
<button class="flex-1 bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-colors py-3 rounded-full font-label-sm text-label-sm flex items-center justify-center gap-2 border border-surface-container-highest">
<span class="material-symbols-outlined text-[18px]">call</span>
                            Call
                        </button>
<button class="flex-1 bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-colors py-3 rounded-full font-label-sm text-label-sm flex items-center justify-center gap-2 border border-surface-container-highest">
<span class="material-symbols-outlined text-[18px]">chat</span>
                            Chat
                        </button>
<button class="w-12 h-12 bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-colors rounded-full flex items-center justify-center border border-surface-container-highest flex-shrink-0">
<span class="material-symbols-outlined">share</span>
</button>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Hidden here as per logic: task-focused screen) -->
<!-- Navigation shell suppressed for linear/tracking focus -->
</body></html>
