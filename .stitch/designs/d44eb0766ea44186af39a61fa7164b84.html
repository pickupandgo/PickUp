<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Payment Method</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#eae7e9",
                        "inverse-on-surface": "#f3f0f2",
                        "tertiary-container": "#231a09",
                        "tertiary": "#000000",
                        "surface-variant": "#e5e1e4",
                        "on-surface-variant": "#46464d",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#514531",
                        "surface-container-highest": "#e5e1e4",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fcf8fb",
                        "surface-container-low": "#f6f3f5",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#dde1ff",
                        "surface-dim": "#dcd9db",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#f3e0c5",
                        "on-tertiary-fixed": "#231a09",
                        "on-primary-container": "#7e829e",
                        "surface": "#fcf8fb",
                        "inverse-primary": "#c0c5e3",
                        "primary-container": "#151a31",
                        "surface-container": "#f0edef",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#151a31",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1b1b1d",
                        "secondary-fixed": "#d8e2ff",
                        "on-secondary-fixed": "#0e1b33",
                        "secondary-fixed-dim": "#bac6e6",
                        "primary": "#000000",
                        "primary-fixed-dim": "#c0c5e3",
                        "secondary-container": "#d4dfff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#3b4760",
                        "on-primary-fixed-variant": "#40465e",
                        "surface-tint": "#585d77",
                        "on-secondary-container": "#57637e",
                        "error-container": "#ffdad6",
                        "outline": "#77767e",
                        "on-background": "#1b1b1d",
                        "tertiary-fixed-dim": "#d6c4aa",
                        "secondary": "#525e79",
                        "background": "#fcf8fb",
                        "inverse-surface": "#313032",
                        "outline-variant": "#c7c5ce",
                        "on-tertiary-container": "#91826a"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "container-padding": "16px",
                        "row-height-md": "56px",
                        "row-height-sm": "40px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "data-mono": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "body-lg": ["15px", { "lineHeight": "22px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .custom-radio:checked {
            background-color: #151a31; /* primary-container */
            border-color: #151a31;
        }
        .custom-radio:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-background z-40">
<div class="flex justify-between items-center px-container-padding h-row-height-md w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary font-bold">Delivery</h1>
<button class="h-10 px-3 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150 text-primary font-label-sm text-label-sm">
                Help
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-padding pt-4 pb-[100px] flex flex-col gap-6 w-full max-w-md mx-auto">
<!-- Header & Amount -->
<div class="flex flex-col gap-2 pt-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Payment Method</h2>
<div class="bg-surface-container-low rounded-lg p-6 flex flex-col items-center justify-center gap-1 shadow-sm border border-surface-variant">
<span class="font-label-sm text-label-sm text-on-surface-variant">Amount to pay</span>
<span class="font-headline-md text-headline-md text-primary-container text-2xl">₹ 450.00</span>
</div>
</div>
<!-- Payment Options -->
<div class="flex flex-col gap-3">
<!-- Option 1: COD (Unselected) -->
<label class="group relative flex items-center p-4 bg-surface-container-lowest border border-outline-variant rounded-[24px] cursor-pointer hover:bg-surface-container-low transition-colors duration-200">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-4 text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">payments</span>
</div>
<div class="flex-grow">
<span class="font-headline-sm text-headline-sm text-on-surface block">Cash on Delivery (COD)</span>
</div>
<div class="relative flex items-center justify-center">
<input class="custom-radio appearance-none w-6 h-6 border-2 border-outline rounded-full transition-all duration-200" name="payment_method" type="radio" value="cod"/>
</div>
</label>
<!-- Option 2: Cash at Pickup (Unselected) -->
<label class="group relative flex items-center p-4 bg-surface-container-lowest border border-outline-variant rounded-[24px] cursor-pointer hover:bg-surface-container-low transition-colors duration-200">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-4 text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">local_atm</span>
</div>
<div class="flex-grow">
<span class="font-headline-sm text-headline-sm text-on-surface block">Cash at Pickup</span>
</div>
<div class="relative flex items-center justify-center">
<input class="custom-radio appearance-none w-6 h-6 border-2 border-outline rounded-full transition-all duration-200" name="payment_method" type="radio" value="pickup"/>
</div>
</label>
<!-- Option 3: UPI (Selected State) -->
<label class="group relative flex items-center p-4 bg-surface-container-lowest border-2 border-primary-container rounded-[24px] cursor-pointer bg-primary-fixed/30 transition-colors duration-200">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center mr-4 text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<div class="flex-grow">
<span class="font-headline-sm text-headline-sm text-on-surface block">Pay via UPI</span>
</div>
<div class="relative flex items-center justify-center">
<input checked="" class="custom-radio appearance-none w-6 h-6 border-2 border-primary-container bg-primary-container rounded-full transition-all duration-200" name="payment_method" type="radio" value="upi"/>
</div>
</label>
</div>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-surface-variant p-container-padding pb-safe z-50">
<div class="max-w-md mx-auto w-full">
<button class="w-full h-[56px] bg-primary-container text-on-primary-container rounded-full font-headline-sm text-headline-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center text-white">
                CONTINUE
            </button>
</div>
</div>
<!-- BottomNavBar is suppressed as this is a transactional flow focused on payment selection -->
<script>
        // Simple JS to handle styling of radio cards
        document.querySelectorAll('input[type="radio"][name="payment_method"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all cards
                document.querySelectorAll('label.group').forEach(label => {
                    label.classList.remove('border-primary-container', 'bg-primary-fixed/30', 'border-2');
                    label.classList.add('border-outline-variant', 'border');
                    
                    const iconContainer = label.querySelector('.rounded-full');
                    iconContainer.classList.remove('bg-primary-container', 'text-on-primary');
                    iconContainer.classList.add('bg-surface-container', 'text-on-surface-variant');
                    
                    const icon = label.querySelector('.material-symbols-outlined');
                    icon.style.fontVariationSettings = "'FILL' 0";
                });

                // Style selected card
                if(e.target.checked) {
                    const selectedLabel = e.target.closest('label');
                    selectedLabel.classList.remove('border-outline-variant', 'border');
                    selectedLabel.classList.add('border-primary-container', 'bg-primary-fixed/30', 'border-2');
                    
                    const iconContainer = selectedLabel.querySelector('.rounded-full');
                    iconContainer.classList.remove('bg-surface-container', 'text-on-surface-variant');
                    iconContainer.classList.add('bg-primary-container', 'text-on-primary');
                    
                    const icon = selectedLabel.querySelector('.material-symbols-outlined');
                    icon.style.fontVariationSettings = "'FILL' 1";
                }
            });
        });
    </script>
</body></html>
