<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Select Drop Location</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#c0c5e3",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#40465e",
                        "outline-variant": "#c7c5ce",
                        "surface": "#fcf8fb",
                        "on-primary-container": "#7e829e",
                        "background": "#fcf8fb",
                        "primary-container": "#151a31",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f3f0f2",
                        "inverse-surface": "#313032",
                        "on-secondary-fixed": "#0e1b33",
                        "tertiary-container": "#231a09",
                        "primary": "#000000"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "16px",
                        "unit": "4px",
                        "gutter": "12px",
                        "row-height-sm": "40px",
                        "row-height-md": "56px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "data-mono": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["15px", { "lineHeight": "22px", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-full overflow-hidden flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Task-focused screen: Navigation shell (TopAppBar/BottomNavBar) is intentionally suppressed to prioritize the map canvas and current workflow. -->
<!-- Map Canvas Area (Dominant) -->
<main class="flex-1 relative w-full h-full bg-surface-container-low">
<!-- Map Background Placeholder -->
<div class="absolute inset-0 bg-cover bg-center w-full h-full object-cover" data-alt="A clean, modern digital map interface displaying the streets of Jodhpur, India. The map uses a minimalist color palette with soft greys for secondary roads and subtle yellow highlights for main arteries, creating a bright light-mode aesthetic suitable for a premium navigation app." data-location="Jodhpur" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAHX5v6oEO5mXpNSd790XoqMkOxo9EvFZ0x3NYamS_sp84oQY_T0sj08XoELN2rr9vbXpY6JP3yJyFwf15VVLn2QI0StttP4vjXa58XHNxIe_lEFxgvhMmxpwwWru2MJ4j74RMhRyj1L2YZ_6Esh5-5C5tLb2vlp8Uf-_lbE-h_FnnZtUy90VgWxdEiR7WEOOWMLV-sKepCW_bv7PMRcAeWYgRqvqRTmDL1Hl69AP9iAGkv1hZzS1yY')"></div>
<!-- Top Controls Overlay -->
<div class="absolute top-0 left-0 w-full p-container-padding flex items-start gap-gutter pt-safe-top z-10">
<!-- Back Button -->
<button aria-label="Go back" class="flex-shrink-0 w-12 h-12 flex items-center justify-center bg-surface-container-lowest rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.08)] active:scale-95 transition-transform text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<!-- Search Field Overlay -->
<div class="flex-1 flex items-center bg-surface-container-lowest rounded-full h-12 px-4 shadow-[0_2px_8px_rgba(0,0,0,0.08)]">
<span class="material-symbols-outlined text-on-surface-variant mr-3">search</span>
<input class="w-full bg-transparent border-none p-0 text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant focus:ring-0 focus:outline-none" placeholder="Search drop location" type="text" value="Shastri Nagar, Jodhpur"/>
<button aria-label="Clear search" class="ml-2 flex items-center justify-center text-on-surface-variant active:text-on-surface">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<!-- Map Pin (Selected Location) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center pointer-events-none z-0">
<div class="bg-primary text-on-primary rounded-full p-2 shadow-lg flex items-center justify-center animate-bounce">
<span class="material-symbols-outlined filled">location_on</span>
</div>
<div class="w-1.5 h-1.5 bg-primary rounded-full mt-1 shadow-md opacity-80"></div>
</div>
<!-- Floating Action Button (Repositioned to map for centering before sheet) -->
<div class="absolute bottom-[280px] right-container-padding z-10">
<button aria-label="Center map" class="w-12 h-12 bg-surface-container-lowest rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.1)] flex items-center justify-center text-on-surface-variant active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</main>
<!-- Bottom Information Panel (Rounded Style) -->
<section class="bg-surface-container-lowest rounded-t-lg shadow-[0_-4px_24px_rgba(0,0,0,0.06)] z-20 flex flex-col w-full relative -mt-4">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-10 h-1 rounded-full bg-outline-variant opacity-50"></div>
</div>
<div class="px-container-padding pb-container-padding pt-2 flex flex-col gap-5">
<!-- Location Header & Address -->
<div class="flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">Drop 1</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Shastri Nagar, Jodhpur</h2>
</div>
<!-- Optional Instructions Input -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">edit_note</span>
</div>
<input class="w-full pl-11 pr-4 py-3.5 bg-surface-variant rounded flex items-center border border-transparent focus:border-outline-variant focus:bg-surface-container-lowest focus:ring-0 transition-colors font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant outline-none" placeholder="Add Landmark / Instructions (Optional)" type="text"/>
</div>
<!-- Action Area -->
<div class="flex flex-col gap-3 mt-2">
<!-- Secondary Action (Compact) -->
<button class="flex items-center justify-center gap-2 py-2 px-4 rounded-full text-primary active:bg-secondary-container transition-colors mx-auto group">
<span class="material-symbols-outlined text-[18px] group-hover:scale-110 transition-transform">add</span>
<span class="font-label-sm text-label-sm font-semibold">Add another drop</span>
</button>
<!-- Primary Action (Capsule) -->
<button class="w-full bg-primary text-on-primary py-4 rounded-full font-label-sm text-label-sm uppercase tracking-wide flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all">
                    Confirm Drop
                    <span class="material-symbols-outlined text-[18px]">check</span>
</button>
</div>
</div>
</section>
</body></html>
