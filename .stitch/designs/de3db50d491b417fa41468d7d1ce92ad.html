<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Payment Processing</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "surface": "#fcf8fb",
                        "surface-container-high": "#eae7e9",

                        "tertiary-fixed": "#f3e0c5",
                        "surface-bright": "#fcf8fb",
                        "on-background": "#1b1b1d",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#91826a",
                        "secondary-fixed": "#d8e2ff",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#d6c4aa",
                        "outline": "#77767e",
                        "inverse-surface": "#313032",
                        "primary-fixed": "#dde1ff",
                        "on-secondary-container": "#57637e",
                        "surface-variant": "#e5e1e4",
                        "on-surface": "#1b1b1d",
                        "inverse-on-surface": "#f3f0f2",
                        "inverse-primary": "#c0c5e3",
                        "on-primary-fixed": "#151a31",
                        "on-primary-container": "#7e829e",
                        "on-error-container": "#93000a",
                        "primary": "#000000",
                        "secondary": "#525e79",
                        "secondary-fixed-dim": "#bac6e6",
                        "surface-tint": "#585d77",
                        "outline-variant": "#c7c5ce",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#d4dfff",
                        "surface-container-low": "#f6f3f5",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#c0c5e3",
                        "primary-container": "#151a31",
                        "on-secondary-fixed-variant": "#3b4760",
                        "on-primary-fixed-variant": "#40465e",
                        "on-secondary-fixed": "#0e1b33",
                        "on-tertiary-fixed-variant": "#514531",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#dcd9db",
                        "tertiary-container": "#231a09",
                        "surface-container": "#f0edef",
                        "surface-container-highest": "#e5e1e4",
                        "on-tertiary-fixed": "#231a09",
                        "background": "#fcf8fb",
                        "tertiary": "#000000"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "row-height-md": "56px",
                        "container-padding": "16px",
                        "row-height-sm": "40px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "body-md": ["Inter"],
                        "data-mono": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],

                }
            }
        }

<style>
        .spinner {
            animation: rotate 2s linear infinite;
        }
        .spinner circle {
            stroke: currentColor;
            stroke-width: 4;
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0;
            animation: dash 1.5s ease-in-out infinite;
            stroke-linecap: round;
        }
        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }
        @keyframes dash {
            0% {
                stroke-dasharray: 1, 200;
                stroke-dashoffset: 0;
            }
            50% {
                stroke-dasharray: 90, 200;
                stroke-dashoffset: -35px;
            }
            100% {
                stroke-dasharray: 90, 200;
                stroke-dashoffset: -124px;
            }
        }
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen w-full flex flex-col overflow-hidden antialiased font-body-md">
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-padding relative">
<!-- Background Ambient Effect -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary-fixed rounded-full blur-3xl opacity-20"></div>
</div>
<div class="relative z-10 flex flex-col items-center max-w-sm w-full">
<!-- Amount Display (Precision Mobility Style) -->
<div class="bg-surface-container-low rounded-lg p-6 w-full text-center mb-12 shadow-sm border border-surface-variant/50 relative overflow-hidden backdrop-blur-md">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-2 uppercase tracking-wider">Amount</p>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">₹ 340.00</h1>
</div>
<!-- Enhanced Loading Visualizer -->
<div class="relative w-32 h-32 mb-10 flex items-center justify-center">
<!-- Outer Pulse Rings -->
<div class="absolute inset-0 rounded-full border-2 border-primary/10 pulse-ring"></div>
<div class="absolute inset-0 rounded-full border-2 border-primary/20 pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Core Spinner -->
<svg class="spinner w-20 h-20 text-primary" viewbox="25 25 50 50">
<circle cx="50" cy="50" fill="none" r="20"></circle>
</svg>
<!-- Center Icon -->
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
</div>
<!-- Typography & Status -->
<div class="text-center space-y-3">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Processing Payment...</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[250px] mx-auto leading-relaxed">
                    Please do not close the app or hit the back button.
                </p>
</div>
<!-- Progress Indicator Dots (Subtle) -->
<div class="flex space-x-2 mt-8 opacity-60">
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0ms"></div>
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 150ms"></div>
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 300ms"></div>
</div>
</div>
</main>
<script>
        // Optional: Add slight interactive parallax to the background element based on device motion if available, 
        // to enhance the 'Precision Mobility' feel, though mostly static for a loading screen to maintain calm.
    </script>
</body></html>
