<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            70% {
                transform: scale(1.3);
                opacity: 0;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Top App Bar (Transactional, so minimal/no nav) -->
<header class="absolute top-0 w-full flex items-center justify-between px-container-padding h-row-height-md z-10 bg-transparent">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-primary active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-on-surface">Pick Up</span>
<div class="w-10"></div> <!-- Spacer -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto flex flex-col items-center justify-center px-container-padding z-10 relative mt-row-height-md">
<!-- Status Indicator -->
<div class="relative w-32 h-32 flex items-center justify-center mb-8">
<div class="absolute inset-0 bg-tertiary-fixed rounded-full pulse-ring"></div>
<div class="absolute inset-2 bg-tertiary-fixed-dim rounded-full pulse-ring" style="animation-delay: 0.3s;"></div>
<div class="relative z-10 w-20 h-20 bg-surface-container-highest rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-4xl text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">hourglass_top</span>
</div>
</div>
<!-- Text Content -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-2 text-center">Payment Pending</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8 max-w-[280px]">
            We are waiting for confirmation from your bank or UPI app. This usually takes a few seconds.
        </p>
<!-- Amount Card (Glassmorphism/Bento style) -->
<div class="bg-surface-container-low rounded-lg p-6 w-full flex flex-col items-center shadow-sm mb-12">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">Amount</span>
<span class="font-data-mono text-3xl font-bold text-on-surface">₹ 340</span>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-4">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-full active:scale-95 transition-transform duration-200 shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">refresh</span>
                Check Status
            </button>
<button class="w-full bg-transparent text-on-surface-variant font-body-md text-body-md py-4 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-200">
                Cancel Payment
            </button>
</div>
</main>
<!-- Subtle background elements for depth -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-gradient-to-br from-surface-container-highest to-surface-bright opacity-30 blur-3xl"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-gradient-to-tr from-secondary-fixed to-surface opacity-20 blur-3xl"></div>
</div>
</body></html>
