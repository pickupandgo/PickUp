<style>
        /* Custom Animations for Radar and Scanning */
        @keyframes radar-pulse {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }
        .animate-radar {
            animation: radar-pulse 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        .animate-radar-delayed {
            animation: radar-pulse 2s cubic-bezier(0, 0, 0.2, 1) infinite;
            animation-delay: 1s;
        }
        
        @keyframes scan-sweep {
            0% { transform: translateX(-150%); }
            100% { transform: translateX(250%); }
        }
        .animate-scan {
            animation: scan-sweep 2.5s infinite linear;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md h-screen w-full overflow-hidden flex justify-center">
<!-- Mobile Viewport Container -->
<div class="relative w-full h-full max-w-md bg-surface overflow-hidden shadow-2xl">
<!-- Top Navigation Bar (from JSON Schema) -->
<header class="fixed top-0 left-0 w-full md:max-w-md md:relative z-50 flex justify-between items-center px-container-padding h-row-height-md bg-surface/80 backdrop-blur-md">
<div class="flex items-center gap-gutter">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[24px]">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-primary">Pick Up</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-variant overflow-hidden border border-outline-variant">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="A small, professional profile picture of a premium user. The portrait is brightly lit, modern, and fits seamlessly into a minimalist interface, conveying trust and reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCdShGwBMmiOaFp7LtKlB08orVY_7zeHGJOH0tHGh0mf-OzkW2-YYbEBznY5y4myLFBW6mNOxrqTT8FIA2GmSWo_iYWSYn7_kFCoEMOfyE1eaxts8gIA_DZbcz4AfRjDPmk3qVU_Kgmn93ZYLeinI9lrDhFHVr8-WHk-9qTkcPSvpYjxNEctIJI_FXnFNo9zJMT8BxEJ_A6bnoE4lJts1MkZWJMTcYTAxlwqBu9VAWaqnqYtdufXgqa"/>
</div>

<!-- Map Background Layer -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center bg-surface-container-high" data-alt="A top-down, highly detailed view of a modern city map interface in light mode. The map features clean, minimal roads in subtle greys, geometric building footprints, and soft pastel green parks. The overall style is highly professional, matching a calm-tech, high-density corporate aesthetic with pristine whites and soft ambient lighting." data-location="Metropolis Downtown" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBvOXOSJRjnub1GIodoCVy1P_p2_0NHK0El_4LAKVp1OfCLaY5w5JGrqAtzIH6vMjrjT_UJHqyN9jWQsOoG4RKNCXpUc-vDIwqR34icHpRqLjEVuSyfpdIHIbqtsPE8L2ng2x8QI5af9N7byXP_89pH7VawsIKn_idqrLe_gHldUu6V8ckYapUPyOxartz0ZCtHJ-7y9Ve-8BE5DhWS0FJGRYowXF2u993PTkmbINnySMBWGY7d2EY-')"></div>
<!-- Gradient Overlay for better contrast -->
<div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-transparent to-surface-container-low/80"></div>
</div>
<!-- Radar Pulse Animation Layer -->
<div class="absolute top-[45%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 flex items-center justify-center">
<!-- Pulsing Rings -->
<div class="absolute w-16 h-16 rounded-full bg-primary/20 animate-radar"></div>
<div class="absolute w-16 h-16 rounded-full bg-primary/20 animate-radar-delayed"></div>
<!-- Center Pin Base -->
<div class="relative w-6 h-6 rounded-full bg-surface shadow-md flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
</div>
</div>
<!-- Bottom Floating Action Card (Task-Focused Focus Mode) -->
<div class="absolute bottom-6 left-container-padding right-container-padding bg-surface-container-lowest rounded-lg p-container-padding shadow-lg z-20 flex flex-col gap-5 border border-outline-variant/30 backdrop-blur-md">
<!-- Status Header -->
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary animate-spin" style="font-variation-settings: 'wght' 300;">progress_activity</span>
<h2 class="font-headline-sm text-headline-sm text-primary">Finding a Driver...</h2>
</div>
<!-- Vehicle Scanning List -->
<div class="relative w-full h-16 bg-surface-container-low rounded-DEFAULT overflow-hidden flex items-center justify-around px-4 border border-outline-variant/50">
<!-- Scanning Sweep Effect -->
<div class="absolute top-0 bottom-0 left-0 w-24 bg-gradient-to-r from-transparent via-primary/10 to-transparent animate-scan z-10 blur-sm pointer-events-none"></div>
<!-- Vehicle Silhouettes -->
<div class="flex flex-col items-center justify-center gap-1 z-0 relative group">
<span class="material-symbols-outlined text-[28px] text-outline group-hover:text-primary transition-colors duration-300" style="font-variation-settings: 'FILL' 1;">directions_car</span>
<span class="font-label-caps text-label-caps text-outline-variant">AUTO</span>
</div>
<div class="w-px h-8 bg-outline-variant/30 z-0"></div>
<div class="flex flex-col items-center justify-center gap-1 z-0 relative group">
<span class="material-symbols-outlined text-[28px] text-outline group-hover:text-primary transition-colors duration-300" style="font-variation-settings: 'FILL' 1;">local_taxi</span>
<span class="font-label-caps text-label-caps text-outline-variant">CAB</span>
</div>
<div class="w-px h-8 bg-outline-variant/30 z-0"></div>
<div class="flex flex-col items-center justify-center gap-1 z-0 relative group">
<span class="material-symbols-outlined text-[28px] text-outline group-hover:text-primary transition-colors duration-300" style="font-variation-settings: 'FILL' 1;">airport_shuttle</span>
<span class="font-label-caps text-label-caps text-outline-variant">VAN</span>
</div>
</div>

<button class="w-full h-row-height-sm rounded-full border border-outline text-on-surface font-label-sm text-label-sm flex items-center justify-center hover:bg-surface-variant hover:text-primary transition-colors active:scale-[0.98] duration-150">
                Cancel
            </button>
</div>
</div>
</body></html>
