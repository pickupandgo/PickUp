<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-dim min-h-screen flex items-end justify-center sm:items-center">
<!-- Bottom Sheet Container (Simulating App Overlay) -->
<div class="w-full max-w-md bg-surface rounded-t-[24px] sm:rounded-[24px] shadow-lg overflow-hidden flex flex-col relative z-10 slide-up sm:m-4">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-12 h-1.5 bg-outline-variant rounded-full opacity-50"></div>
</div>
<div class="p-container-padding flex flex-col gap-6">
<!-- Header -->
<div class="flex justify-between items-center">
<h1 class="font-headline-md text-headline-md text-on-surface">Cancel Trip?</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Trip Context -->
<div class="flex items-center gap-4 bg-surface-container-low p-4 rounded-lg">
<div class="w-12 h-12 bg-secondary-container rounded-full flex items-center justify-center text-on-secondary-container shrink-0">
<span class="material-symbols-outlined">local_shipping</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface-variant">Driver is 5 mins away</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Tata Ace <span class="text-outline mx-1">•</span> RJ 19 XX 1234</span>
</div>
</div>
<!-- Warning Box / Dynamic Charge -->
<div class="bg-error-container/20 border border-error-container rounded-lg p-4 flex flex-col gap-3">
<div class="flex gap-3">
<span class="material-symbols-outlined text-error mt-0.5">warning</span>
<div class="flex flex-col gap-1">
<span class="font-headline-sm text-headline-sm text-error">Estimated Cancellation Fee: ₹112.50</span>
<span class="font-body-sm text-body-md text-on-surface-variant">(25% of fare)</span>
</div>
</div>
<div class="bg-surface-container-low p-3 rounded-md mt-1">
<p class="font-body-sm text-body-md text-on-surface-variant">
                        A cancellation fee may apply based on the driver's proximity to the pickup. Charges are determined by the current cancellation policy.
                    </p>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-2 pb-2">
<button class="w-full h-row-height-md bg-error text-on-error font-headline-sm text-headline-sm rounded-full hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center">
                    CANCEL TRIP
                </button>
<button class="w-full h-row-height-md bg-transparent text-primary font-headline-sm text-headline-sm rounded-full hover:bg-surface-variant/50 active:bg-surface-variant transition-all flex items-center justify-center">
                    KEEP TRIP
                </button>
</div>
</div>
</div>
<style>
        .slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</body></html>
