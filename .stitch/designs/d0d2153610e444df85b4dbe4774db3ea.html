<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Customer Payment Confirmation - Pick Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#dcd9db",
                    "on-primary-container": "#7e829e",
                    "on-primary": "#ffffff",
                    "on-surface-variant": "#46464d",
                    "primary-fixed": "#dde1ff",
                    "background": "#fcf8fb",
                    "on-tertiary-container": "#91826a",
                    "surface-container-high": "#eae7e9",
                    "outline": "#77767e",
                    "surface-variant": "#e5e1e4",
                    "error": "#ba1a1a",
                    "tertiary-container": "#231a09",
                    "on-surface": "#1b1b1d",
                    "on-tertiary-fixed": "#231a09",
                    "tertiary-fixed-dim": "#d6c4aa",
                    "on-primary-fixed-variant": "#40465e",
                    "surface-bright": "#fcf8fb",
                    "secondary-fixed": "#d8e2ff",
                    "on-primary-fixed": "#151a31",
                    "on-error-container": "#93000a",
                    "on-background": "#1b1b1d",
                    "on-secondary-fixed": "#0e1b33",
                    "primary-container": "#151a31",
                    "secondary": "#525e79",
                    "tertiary-fixed": "#f3e0c5",
                    "on-tertiary-fixed-variant": "#514531",
                    "primary": "#000000",
                    "on-tertiary": "#ffffff",
                    "surface-container": "#f0edef",
                    "secondary-container": "#d4dfff",
                    "error-container": "#ffdad6",
                    "inverse-surface": "#313032",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#57637e",
                    "surface-container-highest": "#e5e1e4",
                    "secondary-fixed-dim": "#bac6e6",
                    "primary-fixed-dim": "#c0c5e3",
                    "surface-tint": "#585d77",
                    "tertiary": "#000000",
                    "on-secondary-fixed-variant": "#3b4760",
                    "inverse-primary": "#c0c5e3",
                    "inverse-on-surface": "#f3f0f2",
                    "on-error": "#ffffff",
                    "outline-variant": "#c7c5ce",
                    "on-secondary": "#ffffff",
                    "surface-container-low": "#f6f3f5",
                    "surface": "#fcf8fb"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "row-height-md": "56px",
                    "container-padding": "16px",
                    "gutter": "12px",
                    "row-height-sm": "40px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "headline-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "label-caps": ["Inter"],
                    "data-mono": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],
                    "headline-sm": ["16px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "data-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        /* Minimalist scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--tw-colors-outline-variant);
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col items-center">
<!-- Mobile Container (Max width for web viewing) -->
<main class="w-full max-w-[428px] min-h-screen flex flex-col relative bg-surface shadow-2xl overflow-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface flex items-center justify-between px-container-padding h-row-height-md">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors active:opacity-80 text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Trip Payment</h1>
<button aria-label="More options" class="p-2 -mr-2 rounded-full hover:bg-surface-container-low transition-colors active:opacity-80 text-primary">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-container-padding pb-32 space-y-6">
<!-- STATE 1: SUCCESS (Default View) -->
<section class="space-y-6 block" id="state-success">
<!-- Status Card (Success) -->
<div class="bg-surface-container-low rounded-lg p-6 flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-on-secondary-fixed text-3xl" data-icon="check_circle">check_circle</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Payment Successful</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Your transaction was completed.</p>
</div>
<!-- Payment Details (Success) -->
<div class="bg-surface-container-low rounded-lg p-6">
<div class="text-center mb-6 border-b border-outline-variant/30 pb-6">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-2">Final Amount</p>
<p class="text-4xl font-bold text-on-surface font-headline-md tracking-tight">₹450</p>
</div>
<div class="space-y-4">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Payment Method</span>
<span class="font-body-md text-body-md text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="account_balance">account_balance</span>
                                UPI (Secure)
                            </span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Status</span>
<span class="bg-secondary-fixed-dim text-on-secondary-fixed px-3 py-1 rounded-full font-label-sm text-label-sm">Paid</span>
</div>
</div>
</div>
<!-- Trip Summary -->
<div class="bg-surface-container-low rounded-lg p-5">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-4">Trip Summary</h3>
<div class="space-y-3">
<div class="flex justify-between">
<span class="font-body-md text-body-md text-on-surface-variant">Trip ID</span>
<span class="font-data-mono text-data-mono text-on-surface">#TRP-8472-X</span>
</div>
<div class="flex justify-between">
<span class="font-body-md text-body-md text-on-surface-variant">Date</span>
<span class="font-body-md text-body-md text-on-surface">Oct 24, 2023 • 14:30</span>
</div>
<div class="flex justify-between">
<span class="font-body-md text-body-md text-on-surface-variant">Distance</span>
<span class="font-body-md text-body-md text-on-surface">12.4 km</span>
</div>
</div>
</div>
</section>
<!-- ACTION BUTTONS (Fixed at bottom) -->
<div class="fixed bottom-0 w-full max-w-[428px] bg-surface/90 backdrop-blur-md p-container-padding border-t border-outline-variant/20 z-40">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full py-4 px-6 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm">
                    DONE
                </button>
</div>
</div>
</main>
</body></html>
