<input class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant focus:ring-0" placeholder="Current Location" readonly="" type="text"/>
</div>
</div>
<!-- Connecting Line -->
<div class="absolute left-[34px] top-[48px] bottom-[48px] w-0.5 bg-outline-variant/30"></div>
<!-- Drop Off Field -->
<div class="flex items-center gap-gutter bg-surface-variant rounded-md p-3 focus-within:ring-2 focus-within:ring-primary/20 transition-all cursor-pointer" onclick="document.getElementById('errorOverlay').classList.remove('hidden'); document.getElementById('errorOverlay').classList.add('flex');">
