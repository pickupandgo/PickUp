<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased md:bg-surface-container-low md:items-center md:justify-center">
<!-- Mobile Wrapper for Desktop testing -->
<div class="w-full h-full min-h-screen flex flex-col md:w-[414px] md:h-[896px] md:min-h-0 md:bg-surface md:shadow-xl md:rounded-[3rem] md:overflow-hidden relative bg-surface">
<!-- TopAppBar (Suppressed as this is a transactional flow, but user wants a specific screen. Replacing with back action header) -->
<header class="w-full top-0 sticky bg-surface flex flex-col z-10">
<div class="flex items-center justify-between px-container-padding h-row-height-md w-full">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-200 text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 text-center font-headline-md text-headline-md font-bold text-on-surface">Payment</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
<!-- Subtle gradient separator -->
<div class="h-4 w-full bg-gradient-to-b from-surface to-transparent"></div>
</header>
<!-- Main Content -->
<main class="flex-1 px-container-padding pb-[100px] overflow-y-auto">
<!-- Summary Card -->
<section class="mt-4 mb-8 bg-surface-container-low rounded-lg p-6 shadow-sm flex flex-col items-center justify-center relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/5 rounded-full blur-2xl"></div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">Total Amount</p>
<div class="font-headline-md text-[40px] font-bold text-primary tracking-tight leading-none">
<span class="font-headline-sm text-headline-sm align-top mr-1 text-on-surface-variant">₹</span>340
                </div>
</section>
<!-- Payment Methods List -->
<h2 class="font-headline-sm text-headline-sm font-semibold mb-4 px-2">Select Payment Method</h2>
<div class="flex flex-col gap-4">
<!-- COD Option (Active) -->
<label class="relative flex items-center p-4 rounded-lg bg-surface-container-lowest border-2 border-primary cursor-pointer transition-all active:scale-[0.98] shadow-sm">
<input checked="" class="peer sr-only" name="payment_method" type="radio" value="cod"/>
<!-- Icon Container -->
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-primary mr-4 flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<!-- Details -->
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-primary">Cash on Delivery</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Pay with cash when package arrives</p>
</div>
<!-- Radio Indicator -->
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center ml-2 relative">
<div class="w-3 h-3 rounded-full bg-primary opacity-100 transition-opacity"></div>
</div>
</label>
<!-- CAP Option -->
<label class="relative flex items-center p-4 rounded-lg bg-surface-container-lowest border-2 border-transparent hover:border-surface-variant cursor-pointer transition-all active:scale-[0.98] shadow-sm">
<input class="peer sr-only" name="payment_method" type="radio" value="cap"/>
<!-- Icon Container -->
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant mr-4 flex-shrink-0 transition-colors peer-checked:bg-primary-container peer-checked:text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">storefront</span>
</div>
<!-- Details -->
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface peer-checked:text-primary transition-colors">Cash at Pickup</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Pay at the store counter</p>
</div>
<!-- Radio Indicator -->
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center ml-2 peer-checked:border-primary transition-colors">
<div class="w-3 h-3 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</label>
<!-- Digital Fallback (Disabled visual) -->
<div class="relative flex items-center p-4 rounded-lg bg-surface-container-lowest border border-transparent opacity-60 cursor-not-allowed">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant mr-4 flex-shrink-0">
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg text-on-surface">Digital Wallet</h3>
<p class="font-label-sm text-label-sm text-error mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">error</span> Unavailable for this order
                        </p>
</div>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full md:absolute bg-surface-container-lowest pt-4 pb-8 px-container-padding rounded-t-lg shadow-[0_-4px_24px_rgba(0,0,0,0.05)]">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-full active:scale-95 transition-transform duration-200 flex items-center justify-center shadow-md">
                Confirm Booking
                <span class="material-symbols-outlined ml-2">arrow_forward</span>
</button>
</div>
</div>
<script>
        // Simple script to handle radio button visual states if needed beyond CSS peer classes
        document.querySelectorAll('input[name="payment_method"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Remove active classes from all
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('border-primary');
                    label.classList.add('border-transparent');
                    
                    const iconContainer = label.querySelector('.w-12');
                    if(iconContainer && !e.target.checked) {
                        iconContainer.classList.remove('bg-primary-container', 'text-primary');
                        iconContainer.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                        
                        const icon = iconContainer.querySelector('span');
                        if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                    }
                });

                // Add active classes to selected
                if(e.target.checked) {
                    const parentLabel = e.target.closest('label');
                    parentLabel.classList.remove('border-transparent');
                    parentLabel.classList.add('border-primary');
                    
                    const iconContainer = parentLabel.querySelector('.w-12');
                    if(iconContainer) {
                         iconContainer.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                         iconContainer.classList.add('bg-primary-container', 'text-primary');
                         
                         const icon = iconContainer.querySelector('span');
                         if(icon) icon.style.fontVariationSettings = "'FILL' 1";
                    }
                }
            });
        });
    </script>
</body></html>
