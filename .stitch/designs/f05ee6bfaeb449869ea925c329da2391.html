<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">arrow_back</span>

<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">more_vert</span>

<main class="flex-grow flex flex-col px-container-padding pt-6 max-w-lg mx-auto w-full">
<!-- Drop Context Card -->

<div class="absolute top-0 right-0 p-4 opacity-5">

</div>

                Please share this 4-digit code with the driver to confirm your delivery handover.
            </p>
<div class="flex gap-4 mb-2" id="otp-container">
<input class="w-14 h-16 text-center font-headline-md text-[24px] bg-surface-variant rounded-[16px] border-2 border-transparent focus:border-primary focus:bg-surface outline-none transition-all duration-200" maxlength="1" type="text" value="4"/>
<input class="w-14 h-16 text-center font-headline-md text-[24px] bg-surface-variant rounded-[16px] border-2 border-transparent focus:border-primary focus:bg-surface outline-none transition-all duration-200" maxlength="1" type="text" value="8"/>

<input class="w-14 h-16 text-center font-headline-md text-[24px] bg-surface-variant rounded-[16px] border-2 border-transparent focus:border-primary focus:bg-surface outline-none transition-all duration-200" maxlength="1" type="text"/>

                    Resend OTP
                </button>
</div>

<script>
        // Simple interaction script for OTP inputs
        const inputs = document.querySelectorAll('#otp-container input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
