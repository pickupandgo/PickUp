<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

<body class="bg-background text-on-background min-h-screen flex flex-col relative pb-32">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-background z-50">
<div class="flex justify-between items-center px-container-padding h-row-height-md w-full">
<button aria-label="Go back" class="text-primary dark:text-primary-fixed hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors active:scale-95 duration-150 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile md:text-headline-sm text-primary dark:text-on-primary-fixed flex-1 text-center font-bold mr-8">Delivery</h1>
</div>
</header>
<main class="flex-1 px-container-padding pt-6 flex flex-col gap-8 max-w-2xl mx-auto w-full">
<!-- Destination Header -->
<section class="bg-surface-container-low rounded-lg p-6 flex items-start gap-4 shadow-sm border border-surface-container-highest">
<div class="bg-secondary-container text-on-secondary-container rounded-full p-3 flex-shrink-0 mt-1">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-secondary mb-1">DROP 1</span>
<p class="font-headline-sm text-headline-sm text-on-surface">Shastri Nagar, Jodhpur</p>
</div>
</section>
<!-- Form Section -->
<section class="flex flex-col gap-6">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Who is receiving the goods?</h2>
<!-- Input 1 (Name) -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="receiver-name">RECEIVER NAME</label>
<div class="relative">
<input class="w-full bg-surface-variant border-none rounded-[12px] px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface transition-all duration-200" id="receiver-name" placeholder="Enter name" type="text"/>
</div>
</div>
<!-- Input 2 (Contact) -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="contact-number">MOBILE NUMBER</label>
<div class="relative flex items-center bg-surface-variant rounded-[12px] focus-within:ring-2 focus-within:ring-primary focus-within:bg-surface transition-all duration-200">
<span class="pl-4 pr-2 font-data-mono text-data-mono text-on-surface-variant border-r border-outline-variant/30">+91</span>
<input class="w-full bg-transparent border-none rounded-r-[12px] px-4 py-3 font-data-mono text-data-mono text-on-surface placeholder-outline-variant focus:ring-0" id="contact-number" placeholder="Enter 10-digit number" type="tel"/>
</div>
<!-- Validation State (Subtle Error) -->
<div class="flex items-center gap-1 mt-1 text-error hidden" id="phone-error">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="font-label-sm text-label-sm">Please enter a valid 10-digit number</span>
</div>
</div>
<!-- Input 3 (Instructions) -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="instructions">DELIVERY INSTRUCTIONS (OPTIONAL)</label>
<textarea class="w-full bg-surface-variant border-none rounded-[12px] px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface transition-all duration-200 resize-none" id="instructions" placeholder="e.g. Near the blue gate, 2nd floor..." rows="3"></textarea>
</div>
</section>
</main>
<!-- Bottom Action -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/80 backdrop-blur-md border-t border-surface-container-highest p-4 pb-safe z-40">
<div class="max-w-2xl mx-auto w-full">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-full hover:bg-primary/90 active:scale-[0.98] transition-all duration-200 shadow-md">
                CONTINUE
            </button>
</div>
</div>
<script>
        // Simple validation script for demo purposes
        const phoneInput = document.getElementById('contact-number');
        const phoneError = document.getElementById('phone-error');

        phoneInput.addEventListener('input', (e) => {
            const val = e.target.value.replace(/\D/g, '');
            if (val.length > 0 && val.length < 10 && document.activeElement !== phoneInput) {
               // Show error only if they typed something but not 10 digits and blurred (simplified logic for demo)
            }
        });
        
        phoneInput.addEventListener('blur', (e) => {
             const val = e.target.value.replace(/\D/g, '');
             if(val.length > 0 && val.length !== 10) {
                 phoneError.classList.remove('hidden');
                 phoneInput.closest('.relative').classList.add('ring-2', 'ring-error', 'bg-error-container/10');
                 phoneInput.closest('.relative').classList.remove('focus-within:ring-primary', 'bg-surface-variant');
             } else {
                 phoneError.classList.add('hidden');
                 phoneInput.closest('.relative').classList.remove('ring-2', 'ring-error', 'bg-error-container/10');
                 phoneInput.closest('.relative').classList.add('focus-within:ring-primary', 'bg-surface-variant');
             }
        });
    </script>
