<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        .spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .pulse-soft {
            animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-sans antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto px-container-padding flex-1 flex flex-col items-center justify-center relative">
<!-- Animated Background Element (Subtle context) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden flex items-center justify-center opacity-10">
<div class="w-[300px] h-[300px] rounded-full border border-outline border-dashed spin-slow" style="animation-duration: 20s;"></div>
<div class="absolute w-[200px] h-[200px] rounded-full border border-outline border-dashed spin-slow" style="animation-direction: reverse; animation-duration: 15s;"></div>
</div>
<!-- Connection Lost Card -->
<div class="bg-surface-container-low rounded-lg p-8 w-full flex flex-col items-center text-center relative z-10 shadow-sm border border-surface-container-high transition-all duration-500 hover:shadow-md">
<!-- Icon Container with Soft Tonal Background -->
<div class="w-24 h-24 rounded-full bg-error-container/30 flex items-center justify-center mb-6 relative">
<!-- Outer radiating ring -->
<div class="absolute inset-0 rounded-full bg-error-container/20 pulse-soft scale-110"></div>
<!-- Main Icon -->
<span class="material-symbols-outlined text-4xl text-error spin-slow" data-icon="sync" style="font-variation-settings: 'FILL' 0, 'wght' 300;">
                    sync
                </span>
</div>
<!-- Typography -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-2 tracking-tight">
                Connection Lost
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[240px] pulse-soft">
                Reconnecting to Pick Up...
            </p>
<!-- Progress Bar (Indeterminate) -->
<div class="w-full h-1 bg-surface-variant rounded-full mt-8 overflow-hidden">
<div class="h-full bg-primary rounded-full w-1/3 animate-[slide_2s_ease-in-out_infinite_alternate] relative"></div>
</div>
<!-- Network Status Details (Subtle) -->
<div class="mt-6 flex items-center gap-2 text-outline font-label-sm text-label-sm bg-surface-container py-1.5 px-3 rounded-full">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 0;">wifi_off</span>
<span>Signal lost at 14:02</span>
</div>
</div>
</main>
<style>
        @keyframes slide {
            0% { transform: translateX(-100%); width: 20%; }
            50% { width: 40%; }
            100% { transform: translateX(300%); width: 20%; }
        }
    </style>
</body></html>
