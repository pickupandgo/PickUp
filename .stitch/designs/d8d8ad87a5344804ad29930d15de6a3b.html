    body {

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top App Bar (Shared Component) -->
<header class="flex items-center justify-between px-container-padding h-row-height-md w-full top-0 bg-background text-primary font-headline-md text-headline-md">
<button class="material-symbols-outlined text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</button>
<span class="font-headline-md text-headline-md font-bold text-primary">Pick Up</span>
<button class="material-symbols-outlined text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform" data-icon="close">close</button>
</header>
<main class="flex-1 flex flex-col px-container-padding pt-4">
<!-- Search Input Area -->
<div class="mb-6">
<div class="relative bg-surface-variant rounded-md flex items-center px-4 py-3 focus-within:ring-2 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="search">search</span>
<input autofocus="" class="w-full bg-transparent border-none p-0 text-on-surface font-body-lg placeholder-on-surface-variant focus:outline-none focus:ring-0" placeholder="Search location" type="text" value="123 Main St"/>
<button class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors ml-3" data-icon="cancel">cancel</button>
</div>
</div>
<!-- Quick Actions Group -->
<div class="flex gap-3 mb-6">
<button class="flex items-center gap-2 bg-secondary-container text-on-secondary-container px-4 py-2 rounded-full font-label-sm text-label-sm hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="my_location" style="font-variation-settings: 'FILL' 1;">my_location</span>
                Current Location
            </button>
<button class="flex items-center gap-2 bg-secondary-container text-on-secondary-container px-4 py-2 rounded-full font-label-sm text-label-sm hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="map" style="font-variation-settings: 'FILL' 1;">map</span>
                Select on Map
            </button>
</div>
<!-- Suggestions / Recent Locations List -->
<div class="bg-surface-container-low rounded-lg p-4 flex-1">
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-4 uppercase">Recent Locations</h3>
<div class="flex flex-col">
<!-- Location Item 1 -->
<button class="flex items-start gap-4 py-4 border-b border-outline-variant/30 hover:bg-surface-container-high transition-colors text-left w-full">
<div class="bg-surface-container rounded-full p-2 mt-1">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="history">history</span>
</div>
<div>
<div class="font-headline-sm text-headline-sm text-on-surface mb-1">123 Main Street</div>
<div class="font-body-md text-body-md text-on-surface-variant">San Francisco, CA 94105</div>
</div>
</button>
<!-- Location Item 2 -->
<button class="flex items-start gap-4 py-4 border-b border-outline-variant/30 hover:bg-surface-container-high transition-colors text-left w-full">
<div class="bg-surface-container rounded-full p-2 mt-1">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="history">history</span>
</div>
<div>
<div class="font-headline-sm text-headline-sm text-on-surface mb-1">San Francisco International Airport (SFO)</div>
<div class="font-body-md text-body-md text-on-surface-variant">Terminal 2, San Francisco, CA 94128</div>
</div>
</button>
<!-- Location Item 3 (Home) -->
<button class="flex items-start gap-4 py-4 border-b border-outline-variant/30 hover:bg-surface-container-high transition-colors text-left w-full">
<div class="bg-surface-container rounded-full p-2 mt-1">
<span class="material-symbols-outlined text-primary" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div>
<div class="font-headline-sm text-headline-sm text-on-surface mb-1">Home</div>
<div class="font-body-md text-body-md text-on-surface-variant">456 Oak Ave, San Francisco, CA 94117</div>
</div>
</button>
<!-- Location Item 4 (Work) -->
<button class="flex items-start gap-4 py-4 border-b border-outline-variant/30 hover:bg-surface-container-high transition-colors text-left w-full">
<div class="bg-surface-container rounded-full p-2 mt-1">
<span class="material-symbols-outlined text-primary" data-icon="work" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<div>
<div class="font-headline-sm text-headline-sm text-on-surface mb-1">Work</div>
<div class="font-body-md text-body-md text-on-surface-variant">789 Market St, San Francisco, CA 94103</div>
</div>
</button>
</div>
