<style>
        .chip-selected {
            background-color: theme('colors.primary-container');
            color: theme('colors.on-primary-container');
            border-color: theme('colors.primary-container');
        }
        .chip-unselected {
            background-color: theme('colors.surface-container-low');
            color: theme('colors.on-surface-variant');
            border-color: transparent;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-sans">
<!-- TopAppBar (From JSON) -->
<header class="flex items-center justify-between px-container-padding h-row-height-md w-full top-0 bg-background dark:bg-background z-10 sticky">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim absolute left-1/2 -translate-x-1/2">Pick Up</h1>
<button aria-label="Close" class="p-2 -mr-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-padding pt-6 pb-24 flex flex-col gap-6 max-w-2xl mx-auto w-full">
<!-- Header Section -->
<section class="flex flex-col gap-2">
<h2 class="font-headline-md text-headline-md text-primary">Declared Value</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Declare the value of your goods to protect your shipment. This determines liability coverage.</p>
</section>
<!-- Value Selection Chips -->
<section class="flex flex-col gap-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="value-chips">
<button class="chip-unselected border rounded-lg py-4 px-4 flex items-center justify-between transition-all hover:bg-surface-container active:scale-95 text-left" onclick="selectChip(this, false)">
<span class="font-headline-sm text-headline-sm">Up to ₹5,000</span>
<span class="material-symbols-outlined hidden check-icon text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="chip-unselected border rounded-lg py-4 px-4 flex items-center justify-between transition-all hover:bg-surface-container active:scale-95 text-left" onclick="selectChip(this, false)">
<span class="font-headline-sm text-headline-sm">₹5,000 - ₹20,000</span>
<span class="material-symbols-outlined hidden check-icon text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="chip-unselected border rounded-lg py-4 px-4 flex items-center justify-between transition-all hover:bg-surface-container active:scale-95 text-left" onclick="selectChip(this, false)">
<span class="font-headline-sm text-headline-sm">₹20,000 - ₹50,000</span>
<span class="material-symbols-outlined hidden check-icon text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="chip-unselected border rounded-lg py-4 px-4 flex items-center justify-between transition-all hover:bg-surface-container active:scale-95 text-left" onclick="selectChip(this, true)">
<span class="font-headline-sm text-headline-sm">Above ₹50,000</span>
<span class="material-symbols-outlined hidden check-icon text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
</section>
<!-- Custom Input Field (Hidden by default) -->
<section class="hidden flex-col gap-2 fade-in" id="custom-value-section">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="custom-value">Enter exact value</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center text-on-surface-variant font-headline-sm text-headline-sm">₹</span>
<input class="w-full bg-surface-variant rounded-md py-4 pl-8 pr-4 font-headline-sm text-headline-sm text-primary border-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" id="custom-value" inputmode="numeric" placeholder="0" type="number"/>
</div>
<p class="font-label-sm text-label-sm text-outline mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                Values above ₹50k require additional verification.
            </p>
</section>
<!-- Decorative / Ambient Graphic (Minimalist illustration) -->
<div class="mt-auto mb-8 flex justify-center opacity-80" data-alt="A minimalist illustration of a stylized cardboard box with a subtle glowing aura around it, set against a pristine, light-mode background. The color palette primarily uses soft grays, bright whites, and a faint tint of indigo to match a modern corporate calm-tech aesthetic. The composition is simple, elegant, and uses soft drop shadows to create a sense of floating depth." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCaDdJ_rHYKga6bPuLo5BOvg0gf7rd8rKOpWyjAhZB5UIzGogB_8RcgwNmnm-vxRwsuJfeahPLVJfIEL5lo5fqjBDkDvJ5kN_2XJZPZThSXLxJxBa9fPgLWu4c_Fp9PyElXce5tDalJme7ZHPsTIQBG-UV7ThqBgvFRaT9imlYMhcHr3hDEk2dTGuX4bbCNn7JMWw5eSuEySxd2bmi8tYitQf7RXiPCBqbliPupZCZD6STzGpSzCrmJ'); height: 120px; width: 100%; background-size: contain; background-repeat: no-repeat; background-position: center;">
<!-- Placeholder for generative art -->
</div>
</main>
<!-- Bottom Action Bar (Contextual FAB / Next Button area) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-container p-container-padding z-40 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<button class="w-full max-w-2xl mx-auto bg-primary text-on-primary rounded-full py-4 font-headline-sm text-headline-sm flex items-center justify-center gap-2 active:scale-95 transition-transform hover:opacity-90">
            Next
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
<!-- Note: Suppressed BottomNavBar due to transactional intent (linear flow) -->
<script>
        function selectChip(clickedBtn, isCustom) {
            // Reset all chips
            const chips = document.querySelectorAll('#value-chips button');
            chips.forEach(chip => {
                chip.classList.remove('chip-selected');
                chip.classList.add('chip-unselected');
                chip.querySelector('.check-icon').classList.add('hidden');
            });

            // Select clicked chip
            clickedBtn.classList.remove('chip-unselected');
            clickedBtn.classList.add('chip-selected');
            clickedBtn.querySelector('.check-icon').classList.remove('hidden');

            // Toggle custom input
            const customSection = document.getElementById('custom-value-section');
            if (isCustom) {
                customSection.classList.remove('hidden');
                customSection.classList.add('flex');
                setTimeout(() => document.getElementById('custom-value').focus(), 100);
            } else {
                customSection.classList.add('hidden');
                customSection.classList.remove('flex');
            }
        }
    </script>
</body></html>
